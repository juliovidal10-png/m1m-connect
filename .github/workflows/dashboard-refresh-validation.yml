name: Dashboard refresh validation
on:
  pull_request:
    paths:
      - "painel/src/components/dashboard/DashboardOperacional.tsx"
      - "painel/tests/regression/dashboard-refresh-*.mjs"
      - ".github/workflows/dashboard-refresh-validation.yml"
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node tests/regression/dashboard-refresh-regression.mjs
      - run: npm install --no-save --package-lock=false --ignore-scripts esbuild@0.25.12 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/regression/dashboard-refresh-browser.mjs
