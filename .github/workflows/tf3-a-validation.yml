name: TF3-A validation

on:
  pull_request:
    paths:
      - "painel/src/components/chat/ChatInbox.tsx"
      - "painel/src/components/layout/Sidebar.tsx"
      - "painel/src/app/api/chat/read/route.ts"
      - "painel/src/app/api/chat/list/route.ts"
      - "painel/tests/**"
      - "painel/prisma/**"
      - "painel/src/services/conversation-unread-state.service.ts"
      - "painel/src/services/conversation-sync.service.ts"
      - "painel/src/services/incoming-message-pipeline.service.ts"
      - "painel/src/services/tf3a-webhook-evidence.ts"
      - "painel/src/app/api/webhooks/evolution/messages/route.ts"
      - "painel/src/app/api/chat/unread-count/route.ts"
      - "painel/src/app/api/chat/hide-conversation/route.ts"
      - "tools/tf3a-origin-observation/**"
      - ".github/workflows/tf3-a-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TF3-A ledger structure and behavior (no database)
        run: |
          node tests/regression/tf3a-unread-ledger-structure.mjs
          node tests/regression/tf3a-unread-ledger-behavior.mjs
          node tests/regression/tf3a-read-before-ledger-route.mjs
          node tests/regression/tf3a-sidebar-count-route.mjs
          node tests/regression/tf3a-sidebar-count-effect.mjs
          node tests/regression/tf3a-webhook-evidence.mjs
      - name: TF3-A origin observer (offline, no WhatsApp)
        run: |
          node --check ../tools/tf3a-origin-observation/prepare.mjs
          node --check ../tools/tf3a-origin-observation/observer.cjs
          node --test ../tools/tf3a-origin-observation/observer.test.mjs
      - name: Compare ESLint against main (no new findings)
        run: |
          git fetch --no-tags --depth=1 origin main
          node tests/regression/tf3-a-eslint-baseline.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unread merge diagnostic (synthetic JID/LID)
        run: node tests/regression/tf3-a-unread-merge-diagnostic.mjs
      - name: Frontend unread merge diagnostic (synthetic JID/LID)
        run: node tests/regression/tf3-a-unread-frontend-diagnostic.mjs
      - name: Existing regression tests
        run: |
          npm run test:regression:t17
          npm run test:regression:tf6
