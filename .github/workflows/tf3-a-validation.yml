name: TF3-A validation

on:
  pull_request:
    paths:
      - "painel/src/components/chat/ChatInbox.tsx"
      - "painel/src/components/chat/ChatConversationSidebar.tsx"
      - "painel/src/components/chat/AttendanceActions.tsx"
      - "painel/src/lib/conversation-queue.ts"
      - "painel/src/app/api/chat/read/route.ts"
      - "painel/src/app/api/chat/list/route.ts"
      - "painel/tests/**"
      - ".github/workflows/tf3-a-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Compare ESLint against main (no new findings)
        run: |
          git fetch --no-tags --depth=1 origin main
          node tests/regression/tf3-a-eslint-baseline.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unread merge diagnostic (synthetic JID/LID)
        run: node tests/regression/tf3-a-unread-merge-diagnostic.mjs
      - name: Frontend unread merge diagnostic (synthetic JID/LID)
        run: node tests/regression/tf3-a-unread-frontend-diagnostic.mjs
      - name: Operational conversation queues
        run: |
          node tests/regression/conversation-queues-api-regression.mjs
          node tests/regression/attendance-queue-refresh-regression.mjs
          node tests/regression/conversation-tab-latency-regression.mjs
      - name: Existing regression tests
        run: |
          npm run test:regression:t17
          npm run test:regression:tf6
